[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-archive-api"
version = "0.1.0"
description = "Mind Archive backend — local-first personal AI archive"
readme = "README.md"
license = { text = "LicenseRef-PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"

# Kept deliberately small. Every dependency is a maintenance cost and a
# security surface; see CONTRIBUTING.md before adding one.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Required by FastAPI to accept an uploaded export file.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mind_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # security
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mind_archive"]
