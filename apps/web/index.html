<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind Archive</title>
    <meta
      name="description"
      content="Your personal AI mind archive. Own your AI memory. Simple, private, and yours."
    />

    <script>
      // Set the palette and theme before the first paint, so nobody sees a
      // flash of the wrong colours. Kept tiny and inline on purpose, and kept
      // in step with apps/web/src/theme.ts.
      (function () {
        var root = document.documentElement;
        var palette = "minimal";
        var theme = "system";

        try {
          var storedPalette = localStorage.getItem("mind-archive-palette");
          if (
            storedPalette === "minimal" ||
            storedPalette === "warm" ||
            storedPalette === "violet"
          ) {
            palette = storedPalette;
          }

          var storedTheme = localStorage.getItem("mind-archive-theme");
          if (
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system"
          ) {
            theme = storedTheme;
          }
        } catch (error) {
          // Storage unavailable; the defaults above stand.
        }

        if (theme === "system") {
          var dark = false;
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (error) {
            // No matchMedia; light is the fallback.
          }
          theme = dark ? "dark" : "light";
        }

        root.setAttribute("data-palette", palette);
        root.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
