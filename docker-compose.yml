# Mind Archive — the whole application, locally.
#
#     cp .env.example .env
#     docker compose up --build
#
#     Interface  http://localhost:5173
#     API        http://localhost:8000
#
# Your archive is bind-mounted at ./data, so it stays on your machine and
# survives 'docker compose down'. It is git-ignored.

# Pinned so the project name does not follow the directory name. Without this,
# renaming the folder you cloned into makes Compose treat the running
# containers as a different project, and 'up' fails on the container names
# below instead of reusing them.
name: mindarchive

services:
  api:
    build:
      context: ./apps/api
    container_name: mindarchive-api
    # Published on localhost only. This API has no authentication because it is
    # a single-user local application — do not change this to 0.0.0.0 unless
    # you have put authentication in front of it.
    ports:
      - "127.0.0.1:${MIND_ARCHIVE_API_PORT:-8000}:8000"
    environment:
      MIND_ARCHIVE_DATA_DIR: /data
      # The archive is at /data inside this container, but at ./data on your
      # machine. This is the path the interface shows you.
      MIND_ARCHIVE_DISPLAY_DATA_DIR: ./data
      # Drop a provider export into ./data/inbox and it imports itself.
      MIND_ARCHIVE_INBOX_DIR: ${MIND_ARCHIVE_INBOX_DIR:-}
      MIND_ARCHIVE_INBOX_KEEP_FILES: ${MIND_ARCHIVE_INBOX_KEEP_FILES:-false}
      MIND_ARCHIVE_DEBUG: ${MIND_ARCHIVE_DEBUG:-false}
      MIND_ARCHIVE_LOG_LEVEL: ${MIND_ARCHIVE_LOG_LEVEL:-info}
      MIND_ARCHIVE_CORS_ORIGINS: ${MIND_ARCHIVE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MIND_ARCHIVE_CLOUD_ENABLED: ${MIND_ARCHIVE_CLOUD_ENABLED:-false}
      MIND_ARCHIVE_STORAGE_MODE: ${MIND_ARCHIVE_STORAGE_MODE:-local}
    volumes:
      # Your archive.
      - ./data:/data
      # Source, for hot reload. The virtualenv inside the image is kept.
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    container_name: mindarchive-web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      # The browser makes this request, not the container, so this is the host
      # address rather than the compose service name.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      # The project website, which is where anything about money lives. The
      # default is the local Jekyll server, so the Support link works while
      # developing instead of jumping to the published site.
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:4000}
      # Docker on Windows and macOS cannot always deliver filesystem events
      # into a container. Set VITE_USE_POLLING=true in .env if edits are not
      # picked up.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
      # An anonymous volume keeps the container's node_modules from being
      # shadowed by the host's.
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
