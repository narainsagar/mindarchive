name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  project-memory:
    name: Project memory
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The repository is this project's permanent memory. If the memory is
      # inconsistent, that is a real failure — see
      # docs/project-memory/SESSION_PROTOCOL.md.
      - name: Check project memory
        run: python scripts/session.py check

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for files that must never be committed
        run: |
          set -e
          failed=0
          for pattern in '.env' '*.db' '*.sqlite' '*.sqlite3' '*.pem' '*.key'; do
            found=$(git ls-files "$pattern" || true)
            if [ -n "$found" ]; then
              echo "FAIL: $pattern is tracked by git:"
              echo "$found"
              failed=1
            fi
          done
          if [ -d data ] && [ -n "$(git ls-files data)" ]; then
            echo "FAIL: files under data/ are tracked by git"
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "No secrets, databases or personal archives are tracked."
